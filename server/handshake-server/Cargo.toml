[package]
name = "handshake-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "PQC-VPN server-side handshake responder (PROTOCOL.md v1)"

[lib]
name = "handshake_server"
path = "src/lib.rs"

[[bin]]
name = "handshake-server"
path = "src/main.rs"

[[bin]]
name = "test-client"
path = "src/bin/test-client.rs"

[[bin]]
name = "emit-vectors"
path = "src/bin/emit-vectors.rs"

[dependencies]
# Member 1's shared crate - the frozen crypto. The package itself is named
# `vpn_core` as of the Week 4 checkpoint (it used to be `core`, which shadowed
# Rust's built-in `core` and needed a `package = "core"` alias here).
vpn_core = { path = "../../core" }

# Pinned to the same versions the workspace lockfile already resolves for `core`,
# so wire-format key/ciphertext/signature bytes are interchangeable with the
# client side.
ml-kem = "0.2.3"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
sha2 = "0.10"
rand = "0.8"

# Finish MACs (PROTOCOL.md 5.3). The HKDF key schedule, the transcript and the
# ML-DSA-65 identity all come from vpn_core (PROTOCOL.md 8, Q1/Q2/Q7 resolved).
hmac = "0.12"

hex = "0.4"
base64 = "0.22"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
